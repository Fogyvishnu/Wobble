[workspace]
name = "wobble"
version = "0.1.0"
description = "Project Wobble: Dynamically balancing 2-wheeled biped robot in ROS 2 Jazzy & Gazebo Harmonic"
authors = ["vish"]
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"
c-compiler = "*"
cxx-compiler = "*"
cmake = "*"
make = "*"
pkg-config = "*"
colcon-common-extensions = "*"
ros-jazzy-desktop = "*"
ros-jazzy-ros-gz = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-xacro = "*"
ros-jazzy-joint-state-publisher-gui = "*"
ros-jazzy-teleop-twist-keyboard = "*"
qt-wayland = ">=5.15.15,<6"

[tasks]
build = "colcon build --symlink-install"
check-urdf = "bash -c 'source install/setup.bash && xacro src/wobble_description/urdf/wobble.urdf.xacro > /tmp/wobble.urdf && check_urdf /tmp/wobble.urdf'"
display = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export QT_QPA_PLATFORM=xcb; ros2 launch wobble_description display.launch.py'"
sim = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export GZ_IP=127.0.0.1; export GZ_SIM_SYSTEM_PLUGIN_PATH=$CONDA_PREFIX/lib:$GZ_SIM_SYSTEM_PLUGIN_PATH; export QT_QPA_PLATFORM=xcb; ros2 launch wobble_bringup wobble_sim.launch.py'"
sim-headless = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export GZ_IP=127.0.0.1; export GZ_SIM_SYSTEM_PLUGIN_PATH=$CONDA_PREFIX/lib:$GZ_SIM_SYSTEM_PLUGIN_PATH; export QT_QPA_PLATFORM=xcb; ros2 launch wobble_bringup wobble_sim.launch.py headless:=true rviz:=false remote:=false'"
course = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export GZ_IP=127.0.0.1; export GZ_SIM_SYSTEM_PLUGIN_PATH=$CONDA_PREFIX/lib:$GZ_SIM_SYSTEM_PLUGIN_PATH; export QT_QPA_PLATFORM=xcb; ros2 launch wobble_bringup hurdle_course.launch.py'"
course-headless = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export GZ_IP=127.0.0.1; export GZ_SIM_SYSTEM_PLUGIN_PATH=$CONDA_PREFIX/lib:$GZ_SIM_SYSTEM_PLUGIN_PATH; export QT_QPA_PLATFORM=xcb; ros2 launch wobble_bringup hurdle_course.launch.py headless:=true rviz:=false'"
course-manual = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export GZ_IP=127.0.0.1; export GZ_SIM_SYSTEM_PLUGIN_PATH=$CONDA_PREFIX/lib:$GZ_SIM_SYSTEM_PLUGIN_PATH; export QT_QPA_PLATFORM=xcb; ros2 launch wobble_bringup hurdle_course.launch.py manual:=true'"
auto = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export GZ_IP=127.0.0.1; export GZ_SIM_SYSTEM_PLUGIN_PATH=$CONDA_PREFIX/lib:$GZ_SIM_SYSTEM_PLUGIN_PATH; export QT_QPA_PLATFORM=xcb; ros2 launch wobble_bringup hurdle_course.launch.py'"
auto-headless = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export GZ_IP=127.0.0.1; export GZ_SIM_SYSTEM_PLUGIN_PATH=$CONDA_PREFIX/lib:$GZ_SIM_SYSTEM_PLUGIN_PATH; export QT_QPA_PLATFORM=xcb; ros2 launch wobble_bringup hurdle_course.launch.py headless:=true rviz:=false'"
remote = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export QT_QPA_PLATFORM=xcb; ros2 run wobble_control remote_control'"
remote-cli = "bash -c 'source install/setup.bash && ros2 run wobble_control remote_control --cli'"
teleop = "bash -c 'source install/setup.bash && [ -f /usr/lib/libdrm_amdgpu.so.1 ] && export LD_PRELOAD=/usr/lib/libdrm_amdgpu.so.1; export QT_QPA_PLATFORM=xcb; ros2 run wobble_control remote_control'"
squat = "bash -c 'source install/setup.bash && ros2 topic pub /cmd_squat std_msgs/msg/Float64 \"{data: -0.42}\" -1'"
stand = "bash -c 'source install/setup.bash && ros2 topic pub /cmd_squat std_msgs/msg/Float64 \"{data: 0.0}\" -1'"
